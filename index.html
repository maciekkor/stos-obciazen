<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prosty tracker obciążeń na maszynach siłowych — widzisz, ile ustawić, jednym dotknięciem wchodzisz na kolejny poziom.">
<meta name="theme-color" content="#E7EAEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131619" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Stos Obciążeń</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

  /* reset — na GitHub Pages nie ma warstwy hosta, więc podstawy ustawiamy sami */
  html { -webkit-text-size-adjust: 100%; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  :root {
    --bg: #E7EAEE;
    --surface: #FFFFFF;
    --surface-2: #F0F2F5;
    --line: #D2D8E0;
    --line-strong: #B9C2CC;
    --ink: #14181D;
    --muted: #5D6673;
    --accent: #B4441F;
    --accent-ink: #FFFFFF;
    --good: #24704A;
    --good-soft: #DCEDE3;
    --shadow: 0 1px 2px rgba(20, 24, 29, .06), 0 6px 18px rgba(20, 24, 29, .07);
    --bar-h: 62px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131619; --surface: #1D2126; --surface-2: #262B31;
      --line: #333A42; --line-strong: #47505A;
      --ink: #EDF0F3; --muted: #98A2AD;
      --accent: #E2703F; --accent-ink: #1A0D07;
      --good: #63C08A; --good-soft: #1E3A2B;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131619; --surface: #1D2126; --surface-2: #262B31;
    --line: #333A42; --line-strong: #47505A;
    --ink: #EDF0F3; --muted: #98A2AD;
    --accent: #E2703F; --accent-ink: #1A0D07;
    --good: #63C08A; --good-soft: #1E3A2B;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { overscroll-behavior-y: contain; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  button { -webkit-user-select: none; user-select: none; touch-action: manipulation; }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 12px calc(var(--bar-h) + 34px + env(safe-area-inset-bottom, 0px));
  }

  /* ---------- nagłówek ---------- */
  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 16px 11px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  h1 {
    font-family: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
    font-size: 26px;
    letter-spacing: .04em;
    line-height: 1;
    margin: 0;
    flex: 1;
  }
  .score {
    font-size: 12px;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .score b { color: var(--good); font-weight: 600; }
  .top-menu { margin: -8px -10px -8px -4px; font-size: 21px; }
  .bar {
    height: 3px;
    background: var(--line);
    max-width: 480px;
    margin: 0 auto;
  }
  .bar > i { display: block; height: 100%; background: var(--good); transition: width .2s ease; }

  /* ---------- karta ---------- */
  .list { display: grid; gap: 12px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 13px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card.today { border-color: var(--good); }

  .card-head { display: flex; align-items: flex-start; gap: 8px; }
  .card-head h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.25;
    flex: 1;
    overflow-wrap: anywhere;
  }
  .meta {
    margin: 4px 0 0;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--muted);
  }
  .tag {
    text-transform: uppercase;
    letter-spacing: .07em;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--muted);
  }
  .when.fresh { color: var(--good); font-weight: 500; }

  .icon {
    flex: 0 0 auto;
    width: 44px; height: 44px;
    margin: -8px -8px 0 0;
    display: grid; place-items: center;
    border: 0; border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-size: 17px; line-height: 1;
    cursor: pointer;
  }
  .icon:active { background: var(--surface-2); color: var(--ink); }

  /* stepper — główny element pod kciuk */
  .stepper {
    display: grid;
    grid-template-columns: 76px 1fr 76px;
    gap: 8px;
  }
  .step {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: 34px;
    line-height: 1;
    border: 1px solid var(--line-strong);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 13px;
    cursor: pointer;
    min-height: 68px;
    padding: 0;
  }
  .step:active:not(:disabled) { background: var(--line); }
  .step:disabled { opacity: .3; }
  .step.up { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .step.up:active:not(:disabled) { filter: brightness(.9); background: var(--accent); }

  .readout {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 5px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 13px;
  }
  .num {
    font-family: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
    font-size: 52px;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .unit { font-size: 14px; color: var(--muted); font-weight: 500; }
  .card.unused .num, .card.unused .unit { color: var(--muted); }

  .stack { display: flex; gap: 2px; align-items: flex-end; height: 13px; }
  .plate { flex: 1 1 0; height: 5px; border-radius: 1px; background: var(--line); }
  .plate.on { background: var(--accent); }
  .plate.cur { height: 13px; background: var(--accent); }

  .foot { display: flex; align-items: center; gap: 10px; }
  .lvl {
    flex: 1;
    min-height: 44px;
    font: inherit;
    font-size: 11.5px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    background: none; border: 0; padding: 0;
    text-align: left;
    cursor: pointer;
  }
  .done {
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 11px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .done:active { background: var(--surface-2); }
  .card.today .done { background: var(--good-soft); border-color: var(--good-soft); color: var(--good); }

  .hist {
    border-top: 1px dashed var(--line);
    padding-top: 10px;
    display: grid; gap: 6px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .hist-row { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
  .hist-row b { color: var(--ink); font-weight: 600; }
  .hist-empty { font-style: italic; }

  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }

  /* ---------- dolny pasek ---------- */
  .dock {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 30;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-shadow: 0 -4px 16px rgba(20, 24, 29, .07);
  }
  .dock-inner {
    max-width: 480px;
    margin: 0 auto;
    height: var(--bar-h);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px 0 4px;
  }
  .chips {
    flex: 1;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 0 6px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    font: inherit;
    font-size: 13.5px;
    min-height: 40px;
    padding: 0 15px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--ink); border-color: var(--ink);
    color: var(--surface); font-weight: 500;
  }
  .fab {
    flex: 0 0 auto;
    width: 46px; height: 46px;
    border-radius: 14px;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: 28px; line-height: 1;
    cursor: pointer;
  }
  .fab:active { filter: brightness(.9); }

  /* ---------- arkusz edycji ---------- */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(10, 13, 16, .55);
    z-index: 50;
    display: grid;
    align-items: end;
    justify-items: center;
  }
  .sheet {
    background: var(--surface);
    width: 100%;
    max-width: 480px;
    border-radius: 20px 20px 0 0;
    padding: 8px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    max-height: 92vh;
    overflow-y: auto;
  }
  .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 0 auto 12px; }
  .sheet h3 {
    margin: 0 0 16px;
    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: 25px; font-weight: 400; letter-spacing: .04em;
  }
  .field { display: grid; gap: 6px; margin-bottom: 15px; }
  .field > label, .gen label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); font-weight: 600;
  }
  input, select, textarea {
    font: inherit;
    font-size: 16px; /* 16px = telefon nie przybliża pola przy wpisywaniu */
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    border-radius: 11px;
    padding: 12px;
    width: 100%;
  }
  textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  input:focus-visible, select:focus-visible, textarea:focus-visible,
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { font-size: 12.5px; color: var(--muted); }
  .gen {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin: -6px 0 10px;
  }
  .gen > div { display: grid; gap: 4px; }
  .gen-run {
    grid-column: 1 / -1;
    font: inherit; font-size: 14px;
    min-height: 46px;
    border-radius: 11px;
    border: 1px solid var(--line-strong);
    background: var(--surface-2);
    color: var(--ink);
    cursor: pointer;
  }
  .gen-run:active { background: var(--line); }

  .sheet-actions { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: 16px; font-weight: 500;
    min-height: 50px; padding: 0 18px;
    border-radius: 12px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); flex: 1; }
  .btn.danger { color: var(--accent); }
  .btn.wide { width: 100%; }

  /* ---------- zestawy ćwiczeń ---------- */
  .chip.set { border-color: var(--accent); color: var(--accent); }
  .chip.set[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-ink); font-weight: 500;
  }
  .chip-n { font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; margin-left: 5px; }
  .chip-sep {
    flex: 0 0 auto;
    width: 1px; height: 24px;
    align-self: center;
    background: var(--line-strong);
    margin: 0 3px;
  }

  .setbar {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 11px 8px 11px 13px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .setbar > div { flex: 1; min-width: 0; }
  .setbar h2 {
    margin: 0;
    font-size: 16px; font-weight: 600; line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .setbar .meta { margin-top: 3px; }
  .setbar .icon { margin: 0; }
  .setbar .back {
    flex: 0 0 auto;
    font: inherit;
    font-size: 13px;
    min-height: 40px;
    padding: 0 13px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .setbar .back:active { background: var(--surface-2); }
  .tag.pos { background: var(--accent); color: var(--accent-ink); font-variant-numeric: tabular-nums; }
  .empty .btn { margin-top: 14px; }

  /* układanie zestawu w arkuszu */
  .sub {
    margin: 0 0 7px;
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); font-weight: 600;
  }
  .picks { display: grid; gap: 6px; margin-bottom: 15px; }
  .pick {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 5px 5px 5px 11px;
  }
  .pick .ord { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 19px; }
  .pick .nm { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.25; overflow-wrap: anywhere; }
  .pick .nm small {
    display: block;
    font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted);
  }
  .pick button {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    border: 0; border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-size: 16px; line-height: 1;
    cursor: pointer;
  }
  .pick button:active:not(:disabled) { background: var(--line); color: var(--ink); }
  .pick button:disabled { opacity: .3; }
  .pick button.plus { color: var(--accent); font-size: 23px; }
  .pick.off { opacity: .5; }
  .picks-empty { margin: 0 0 15px; font-size: 13.5px; font-style: italic; color: var(--muted); }
  .setpick { display: flex; gap: 6px; flex-wrap: wrap; }
  .setpick .chip { min-height: 40px; font-size: 13px; }

  /* ---------- rysunki i panel z opisem ---------- */
  .info {
    border-top: 1px dashed var(--line);
    padding-top: 11px;
    display: grid;
    gap: 11px;
  }
  .art {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 10px 8px;
  }
  .mach { width: 47%; max-width: 150px; height: auto; }
  .body { width: 47%; max-width: 150px; height: auto; }
  .mach .mo { fill: var(--line-strong); }
  .mach .ml { stroke: var(--line-strong); stroke-width: 1.6; fill: none; stroke-linecap: round; }
  .body .mu { fill: var(--line-strong); }
  .body .mu.s { fill: var(--accent); fill-opacity: .38; }
  .body .mu.p { fill: var(--accent); }
  .body .mt {
    fill: var(--muted);
    font-size: 9px;
    font-family: inherit;
    text-anchor: middle;
    letter-spacing: .06em;
  }
  .spec { display: grid; gap: 8px; font-size: 13px; color: var(--muted); }
  .spec-row { display: grid; gap: 1px; }
  .spec-row b { color: var(--ink); font-weight: 600; white-space: nowrap; }
  .spec-row.cur b { color: var(--accent); }
  .spec em { font-style: normal; font-variant-numeric: tabular-nums; }
  .spec .mus { border-top: 1px dashed var(--line); padding-top: 8px; line-height: 1.5; }
  .spec .mus b { color: var(--ink); }
  .vsw { display: flex; gap: 6px; flex-wrap: wrap; }
  .vsw .chip { min-height: 38px; font-size: 13px; }

  /* ---------- pasek „na ekran główny" ---------- */
  .install {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13.5px;
    color: var(--muted);
    box-shadow: var(--shadow);
  }
  .install b { color: var(--ink); font-weight: 600; }
  .install button {
    flex: 0 0 auto;
    border: 0; background: transparent;
    color: var(--muted);
    font-size: 18px; line-height: 1;
    width: 32px; height: 32px;
    margin: -4px -6px 0 0;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--bar-h) + 16px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 17px;
    border-radius: 999px;
    font-size: 14px;
    z-index: 60;
    box-shadow: var(--shadow);
    max-width: calc(100% - 32px);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>Karta obciążeń</h1>
    <div class="score" id="score"></div>
    <button class="icon top-menu" id="menu" aria-label="Dane i katalog">⋯</button>
  </div>
  <div class="bar"><i id="barfill" style="width:0%"></i></div>
</header>

<div class="wrap">
  <div id="install-slot"></div>
  <div id="set-slot"></div>
  <main class="list" id="list"></main>
</div>

<nav class="dock" aria-label="Filtr i dodawanie">
  <div class="dock-inner">
    <div class="chips" id="chips"></div>
    <button class="fab" id="add" aria-label="Dodaj maszynę">+</button>
  </div>
</nav>

<script>
(function () {
  "use strict";

  var GROUPS = ["Nogi", "Plecy", "Klatka", "Barki", "Ramiona", "Brzuch", "Cardio", "Inne"];
  var LS_KEY = "stos-obciazen-v1";
  var LS_HINT = "stos-obciazen-hint";
  var LS_VIEW = "stos-obciazen-view";

  function range(from, to, step) {
    var out = [], v = from;
    while (v <= to + 1e-9) { out.push(Math.round(v * 100) / 100); v += step; }
    return out;
  }
  function uid() { return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ---------- katalog ćwiczeń ----------
     Jedna pozycja = jedno ćwiczenie, a pod nim warianty maszyn u różnych producentów.
     Górne końce stosów wg danych producentów:
       Nautilus Inspiration (Core Health & Fitness) — 240 lb ≈ 110 kg, 200 lb ≈ 90 kg,
         Leg Press 400 lb ≈ 180 kg; stos przeskakuje co 5 lb = 2,25 kg.
       Technogym Selection — stosy metryczne, krok 5 kg.
     Konkretny egzemplarz bywa inny (wersja „plus”, dokładki), więc wszystko zostaje
     edytowalne. */
  var BRANDS = {
    insp: { name: "Nautilus Inspiration", short: "Inspiration", step: 2.25 },
    tg: { name: "Technogym Selection", short: "Technogym", step: 5 }
  };
  var INSP_STEPS = [
    { v: 2.25, label: "co 2,25 kg", note: "5 lb" },
    { v: 4.5, label: "co 4,5 kg", note: "10 lb" },
    { v: 9, label: "co 9 kg", note: "20 lb" }
  ];
  var MUSCLES = {
    klatka: "klatka piersiowa",

  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) {} }

  /* ---------- zapis ---------- */
  function payload() { return { machines: state.machines, sets: state.sets, updatedAt: new Date().toISOString() }; }
  var warned = false;
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(payload())); }
    catch (e) {
      if (!warned) { warned = true; toast("Przeglądarka blokuje zapis — wyłącz tryb prywatny"); }
    }
  }
  function save() { saveLocal(); }   // wszystko zostaje w tym telefonie
  /* wybrany widok też zostaje — na siłowni aplikacja otwiera się tam, gdzie się skończyło */
  function saveView() { try { localStorage.setItem(LS_VIEW, filter); } catch (e) {} }
  var toastTimer = null;
  function toast(msg) {
    var old = document.querySelector(".toast");
    if (old) old.remove();
    var el = document.createElement("div");
    el.className = "toast";
    el.setAttribute("role", "status");
    el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.remove(); }, 2800);
  }

  /* ---------- logika ---------- */
  function find(id) {
    for (var i = 0; i < state.machines.length; i++) if (state.machines[i].id === id) return state.machines[i];
    return null;
  }
  function levelOf(m) { return Math.min(Math.max(m.level || 0, 0), Math.max(m.stack.length - 1, 0)); }
  function weightOf(m) { return m.stack.length ? m.stack[levelOf(m)] : null; }
  function stamp(m) {
    var now = new Date().toISOString();
    m.lastAt = now;
    m.history = m.history || [];
    var last = m.history[m.history.length - 1];
    if (last && dayKey(last.t) === dayKey(now)) { last.w = weightOf(m); last.t = now; }
    else m.history.push({ w: weightOf(m), t: now });
    if (m.history.length > 10) m.history = m.history.slice(-10);
  }
  function findSet(id) {
    for (var i = 0; i < state.sets.length; i++) if (state.sets[i].id === id) return state.sets[i];
    return null;
  }
  function activeSet() { return filter.indexOf("s:") === 0 ? findSet(filter.slice(2)) : null; }
  function setMachines(s) {
    return (s.items || []).map(find).filter(function (m) { return !!m; });
  }
  function setLastAt(s) {
    var best = null;
    setMachines(s).forEach(function (m) { if (m.lastAt && (!best || m.lastAt > best)) best = m.lastAt; });
    return best;
  }
  function dropFromSets(id) {
    state.sets.forEach(function (s) {
      s.items = s.items.filter(function (x) { return x !== id; });
    });
  }
  function move(m, dir) {
    if (!m.stack.length) return false;
    var next = Math.min(Math.max(levelOf(m) + dir, 0), m.stack.length - 1);
    if (next === levelOf(m)) return false;
    m.level = next;
    stamp(m);
    save();
    return true;
  }

  /* ---------- widok ---------- */
  function visible() {
    var s = activeSet();
    if (s) return setMachines(s);                       // kolejność z zestawu
    if (filter.indexOf("g:") === 0) {
      var g = filter.slice(2);
      return state.machines.filter(function (m) { return m.group === g; });
    }
    return state.machines.slice();
  }
  function renderChips() {
    var used = [];
    state.machines.forEach(function (m) { if (used.indexOf(m.group) < 0) used.push(m.group); });
    used.sort(function (a, b) { return GROUPS.indexOf(a) - GROUPS.indexOf(b); });
    if (filter.indexOf("g:") === 0 && used.indexOf(filter.slice(2)) < 0) filter = "all";
    if (filter.indexOf("s:") === 0 && !findSet(filter.slice(2))) filter = "all";

    /* „Wszystko” zawsze pierwsze — to widok domowy, musi być pod ręką */
    var html = ['<button class="chip" data-v="all" aria-pressed="' + (filter === "all") + '">Wszystko</button>'];
    html.push('<span class="chip-sep" aria-hidden="true"></span>');
    state.sets.forEach(function (s) {
      var n = setMachines(s).length;
      html.push('<button class="chip set" data-v="s:' + esc(s.id) + '" aria-pressed="' + (filter === "s:" + s.id) + '">' +
        esc(s.name) + (n ? '<span class="chip-n">' + n + "</span>" : "") + "</button>");
    });
    html.push('<span class="chip-sep" aria-hidden="true"></span>');
    used.forEach(function (g) {
      html.push('<button class="chip" data-v="g:' + esc(g) + '" aria-pressed="' + (filter === "g:" + g) + '">' + esc(g) + "</button>");
    });
    var box = document.getElementById("chips");
    box.innerHTML = html.join("");
    /* pasek się przewija — dociągnij aktywny chip do widoku, żeby nie zginął za krawędzią */
    var on = box.querySelector('.chip[aria-pressed="true"]');
    if (on) {
      var l = on.offsetLeft, r = l + on.offsetWidth;
      if (l < box.scrollLeft) box.scrollLeft = Math.max(0, l - 10);
      else if (r > box.scrollLeft + box.clientWidth) box.scrollLeft = r - box.clientWidth + 10;
    }
  }
  /* pasek nad listą: co to za zestaw, ile ćwiczeń, kiedy ostatnio i skrót do edycji */
  function renderSetbar() {
    var slot = document.getElementById("set-slot");
    var s = activeSet();
    if (!s) { slot.innerHTML = ""; return; }
    var n = setMachines(s).length, last = setLastAt(s);
    slot.innerHTML = '<section class="setbar"><div><h2>' + esc(s.name) + "</h2>" +
      '<p class="meta">' +
      '<span class="when' + (isToday(last) ? " fresh" : "") + '">' +
      (n ? n + (n === 1 ? " ćwiczenie · " : " ćw. · ") + esc(ago(last)) : "pusty") + "</span></p></div>" +
      '<button class="back" id="set-back">← Wszystko</button>' +
      '<button class="icon" id="set-edit" aria-label="Edytuj zestaw">✎</button></section>';
    slot.querySelector("#set-edit").addEventListener("click", function () { openSetEditor(s.id); });
    slot.querySelector("#set-back").addEventListener("click", function () {
      filter = "all";
      saveView();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      buzz();
    });
  }
  function renderScore() {
    var s = activeSet();
    var pool = s ? setMachines(s) : state.machines;   // w zestawie liczy się postęp zestawu
    var done = pool.filter(function (m) { return isToday(m.lastAt); }).length;
    var n = pool.length;
    document.getElementById("score").innerHTML = n ? "dziś <b>" + done + "</b> / " + n : "";
    document.getElementById("barfill").style.width = n ? (done / n * 100) + "%" : "0%";
  }
  function muscleName(k) { return MUSCLES[k] || k; }
  function stackDesc(st) {
    if (!st || !st.length) return "brak obciążeń";
    var step = st.length > 1 ? Math.round((st[1] - st[0]) * 100) / 100 : 0;
    return "stos " + fmt(st[0]) + "–" + fmt(st[st.length - 1]) + " kg" +
      (step ? ", co " + fmt(step) + " kg" : "") + " · " + st.length + " poz.";
  }
  function infoHTML(m) {
    var c = exOf(m);
    var pr = c ? c.pr : [], se = c ? c.se : [];
    var art = '<div class="art">' + machineSVG(c ? c.mv : "press") + muscleSVG(pr, se) + "</div>";
    var rows = (m.variants || []).map(function (v, i) {
      var b = BRANDS[v.b];
      return '<div class="spec-row' + (i === m.vi ? " cur" : "") + '"><b>' +
        esc(b ? b.name : "Twoja maszyna") + (v.m ? " — " + esc(v.m) : "") + "</b>" +
        "<em>" + esc(stackDesc(i === m.vi ? m.stack : v.stack)) + "</em></div>";
    }).join("");
    var mus = (pr.length || se.length)
      ? '<div class="mus"><b>Pracują:</b> ' + pr.map(muscleName).join(", ") +
        (se.length ? ' · <b>wspomagają:</b> ' + se.map(muscleName).join(", ") : "") + "</div>"
      : "";
    var sw = (m.variants && m.variants.length > 1)
      ? '<div class="vsw">' + m.variants.map(function (v, i) {
          return '<button class="chip set" data-act="vsw" data-vi="' + i + '" aria-pressed="' + (i === m.vi) + '">' +
            esc(BRANDS[v.b] ? BRANDS[v.b].short : "Moja") + "</button>";
        }).join("") + "</div>"
      : "";
    return '<div class="info">' + art + '<div class="spec">' + rows + mus + "</div>" + sw + "</div>";
  }
  function cardHTML(m, i) {
    var w = weightOf(m), lv = levelOf(m), today = isToday(m.lastAt);
    var pos = activeSet() ? '<span class="tag pos">' + (i + 1) + "</span>" : "";
    var av = variant(m);
    var brandTag = av && BRANDS[av.b] ? '<span class="tag">' + esc(BRANDS[av.b].short) + "</span>" : "";
    var info = openInfo[m.id] ? infoHTML(m) : "";
    var plates = m.stack.map(function (_, i) {
      return '<i class="plate' + (i === lv ? " cur" : (i < lv ? " on" : "")) + '"></i>';
    }).join("");
    var hist = "";
    if (openHist[m.id]) {
      var rows = (m.history || []).slice().reverse().map(function (h) {
        return '<div class="hist-row"><span>' + esc(shortDate(h.t)) + "</span><b>" + fmt(h.w) + " kg</b></div>";
      });
      hist = '<div class="hist">' + (rows.length ? rows.join("") : '<div class="hist-empty">Jeszcze nic tu nie ma.</div>') + "</div>";
    }
    return '<article class="card' + (today ? " today" : "") + (m.lastAt ? "" : " unused") + '" data-id="' + esc(m.id) + '">' +
      '<div class="card-head"><div style="flex:1"><h2>' + esc(m.name) + "</h2>" +
        '<p class="meta">' + pos + '<span class="tag">' + esc(m.group) + "</span>" + brandTag +
        '<span class="when' + (today ? " fresh" : "") + '">' + esc(ago(m.lastAt)) + "</span></p></div>" +
        '<button class="icon" data-act="info" aria-label="O maszynie i mięśniach">&#9432;</button>' +
        '<button class="icon" data-act="edit" aria-label="Edytuj">✎</button></div>' +
      '<div class="stepper">' +
        '<button class="step" data-act="dec" aria-label="Niższy poziom"' + (lv <= 0 ? " disabled" : "") + ">−</button>" +
        '<div class="readout"><span class="num">' + (w === null ? "—" : fmt(w)) + '</span><span class="unit">kg</span></div>' +
        '<button class="step up" data-act="inc" aria-label="Wyższy poziom"' + (lv >= m.stack.length - 1 ? " disabled" : "") + ">+</button>" +
      "</div>" +
      '<div class="stack" aria-hidden="true">' + plates + "</div>" +
      '<div class="foot">' +
        '<button class="lvl" data-act="hist">poziom ' + (lv + 1) + " / " + m.stack.length + " · historia</button>" +
        '<button class="done" data-act="done">' + (today ? "✓ zrobione" : "Zrobione dziś") + "</button>" +
      "</div>" + info + hist + "</article>";
  }
  function render() {
    renderChips();
    renderSetbar();
    renderScore();
    var items = visible();
    var empty = !state.machines.length
      ? '<p class="empty">Nie masz jeszcze żadnej maszyny.<br><button class="btn" data-act="catalog">Weź z katalogu ćwiczeń</button></p>'
      : activeSet()
        ? '<p class="empty">Ten zestaw jest jeszcze pusty.<br><button class="btn" data-act="setup">Ułóż zestaw</button></p>'
        : '<p class="empty">Brak maszyn w tej partii.</p>';
    document.getElementById("list").innerHTML = items.length
      ? items.map(function (m, i) { return cardHTML(m, i); }).join("")
      : empty;
  }
  /* aktualizacja jednej karty bez przebudowy przycisków — płynne trzymanie palca */
  function refreshCard(card, m) {
    var lv = levelOf(m), w = weightOf(m), today = isToday(m.lastAt);
    card.querySelector(".num").textContent = w === null ? "—" : fmt(w);
    var plates = card.querySelectorAll(".plate");
    for (var i = 0; i < plates.length; i++) {
      plates[i].className = "plate" + (i === lv ? " cur" : (i < lv ? " on" : ""));
    }
    card.querySelector(".lvl").textContent = "poziom " + (lv + 1) + " / " + m.stack.length + " · historia";
    card.querySelector('[data-act="dec"]').disabled = lv <= 0;
    card.querySelector('[data-act="inc"]').disabled = lv >= m.stack.length - 1;
    card.classList.toggle("today", today);
    card.classList.toggle("unused", !m.lastAt);
    var when = card.querySelector(".when");
    when.textContent = ago(m.lastAt);
    when.classList.toggle("fresh", today);
    card.querySelector(".done").textContent = today ? "✓ zrobione" : "Zrobione dziś";
    renderSetbar();
    renderScore();
  }

  /* ---------- edytor ---------- */
  function openEditor(id) {
    var m = id ? find(id) : { id: null, name: "", group: "Nogi", stack: range(5, 100, 5), level: 0, lastAt: null, history: [] };
    if (!m) return;
    editing = id || "new";
    /* nowa maszyna dodana z widoku zestawu od razu w nim ląduje */
    var here = activeSet();
    var inSets = state.sets.filter(function (s) {
      return id ? s.items.indexOf(id) >= 0 : (here && s.id === here.id);
    }).map(function (s) { return s.id; });
    var scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Ustawienia maszyny">' +
      '<div class="grab"></div>' +
      "<h3>" + (id ? "Maszyna" : "Nowa maszyna") + "</h3>" +
      (id ? "" : '<button type="button" class="btn wide" id="f-cat" style="margin-bottom:15px">Weź z katalogu ćwiczeń</button>') +
      '<div class="field"><label for="f-name">Nazwa</label><input id="f-name" value="' + esc(m.name) + '" placeholder="np. Wyciąg górny" autocomplete="off"></div>' +
      '<div class="field"><label for="f-group">Partia</label><select id="f-group">' +
        GROUPS.map(function (g) { return '<option value="' + esc(g) + '"' + (g === m.group ? " selected" : "") + ">" + esc(g) + "</option>"; }).join("") +
      "</select></div>" +
      '<div class="field"><label>W zestawach</label><div class="setpick">' +
        state.sets.map(function (s) {
          return '<button type="button" class="chip set" data-set="' + esc(s.id) + '" aria-pressed="' +
            (inSets.indexOf(s.id) >= 0) + '">' + esc(s.name) + "</button>";
        }).join("") + "</div></div>" +
      '<div class="field"><label for="f-stack">Obciążenia (kg)</label>' +
        '<textarea id="f-stack" spellcheck="false" inputmode="decimal">' + esc(m.stack.map(fmt).join(", ")) + "</textarea>" +
        '<span class="hint">Kolejne poziomy stosu, po przecinku — dokładnie jak na maszynie.</span></div>' +
      '<div class="gen">' +
        '<div><label for="g-from">Od</label><input id="g-from" type="number" inputmode="decimal" value="5"></div>' +
        '<div><label for="g-to">Do</label><input id="g-to" type="number" inputmode="decimal" value="100"></div>' +
        '<div><label for="g-step">Co</label><input id="g-step" type="number" inputmode="decimal" value="5"></div>' +
        '<button type="button" class="gen-run" id="g-run">Wypełnij listę</button>' +
      "</div>" +
      '<div class="sheet-actions">' +
        '<button class="btn" id="f-cancel">Anuluj</button>' +
        '<button class="btn primary" id="f-save">Zapisz</button>' +
        (id ? '<button class="btn danger wide" id="f-del">Usuń maszynę</button>' : "") +
      "</div></div>";
    document.body.appendChild(scrim);
    var nameInput = scrim.querySelector("#f-name");
    if (!id) nameInput.focus();

    scrim.addEventListener("click", function (e) { if (e.target === scrim) close(); });
    scrim.querySelector(".setpick").addEventListener("click", function (e) {
      var b = e.target.closest(".chip");
      if (!b) return;
      b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
      buzz();
    });
    /* zaznaczone zestawy z arkusza przypisujemy maszynie po zapisie */
    function applySets(mid) {
      var chips = scrim.querySelectorAll(".setpick .chip");
      for (var i = 0; i < chips.length; i++) {
        var set = findSet(chips[i].getAttribute("data-set"));
        if (!set) continue;
        var want = chips[i].getAttribute("aria-pressed") === "true";
        var has = set.items.indexOf(mid) >= 0;
        if (want && !has) set.items.push(mid);
        else if (!want && has) set.items = set.items.filter(function (x) { return x !== mid; });
      }
    }
    scrim.querySelector("#g-run").addEventListener("click", function () {
      var a = parseFloat(String(scrim.querySelector("#g-from").value).replace(",", "."));
      var b = parseFloat(String(scrim.querySelector("#g-to").value).replace(",", "."));
      var s = parseFloat(String(scrim.querySelector("#g-step").value).replace(",", "."));
      if (!isFinite(a) || !isFinite(b) || !isFinite(s) || s <= 0 || b < a) { toast("Sprawdź wartości od / do / co"); return; }
      if ((b - a) / s > 80) { toast("Za dużo poziomów — zwiększ krok"); return; }
      scrim.querySelector("#f-stack").value = range(a, b, s).map(fmt).join(", ");
      buzz();
    });
    if (!id) scrim.querySelector("#f-cat").addEventListener("click", function () { close(); openCatalog(); });
    scrim.querySelector("#f-cancel").addEventListener("click", close);
    if (id) scrim.querySelector("#f-del").addEventListener("click", function () {
      if (!confirm("Usunąć „" + m.name + "” razem z historią?")) return;
      state.machines = state.machines.filter(function (x) { return x.id !== id; });
      dropFromSets(id);
      save(); close(); render();
    });
    scrim.querySelector("#f-save").addEventListener("click", function () {
      var name = nameInput.value.trim();
      var stack = String(scrim.querySelector("#f-stack").value)
        .split(/[,;\n\s]+/).map(function (v) { return parseFloat(v.replace(",", ".")); })
        .filter(function (v) { return isFinite(v) && v >= 0; });
      stack.sort(function (a, b) { return a - b; });
      if (!name) { toast("Wpisz nazwę maszyny"); nameInput.focus(); return; }
      if (!stack.length) { toast("Podaj przynajmniej jedno obciążenie"); return; }
      var group = scrim.querySelector("#f-group").value;
      if (id) {
        var t = find(id), oldW = weightOf(t);
        t.name = name; t.group = group; t.stack = stack;
        var idx = stack.indexOf(oldW);
        t.level = idx >= 0 ? idx : Math.min(levelOf(t), stack.length - 1);
        syncVariant(t);
        applySets(id);
      } else {
        var fresh = { id: uid(), name: name, group: group, stack: stack, level: 0, lastAt: null, history: [],
          variants: [{ b: "", m: "", stack: stack.slice(), level: 0 }], vi: 0 };
        state.machines.push(fresh);
        applySets(fresh.id);
      }
      save(); close(); render();
    });
    function close() {
      editing = null;
      scrim.remove();
      document.removeEventListener("keydown", onKey);
    }
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
  }

  /* ---------- katalog maszyn ---------- */
  function openCatalog() {
    var step = 2.25;
    var brands = ["insp", "tg"];
    var have = {};
    state.machines.forEach(function (m) {
      if (m.ex) have[m.ex] = true;
      have["n:" + normName(m.name)] = true;
    });
    function mine(c) { return !!(have[c.k] || have["n:" + normName(c.n)]); }
    var picked = {};
    CATALOG.forEach(function (c) { picked[c.k] = !mine(c); });

    var scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Katalog maszyn">' +
      '<div class="grab"></div><h3>Katalog ćwiczeń</h3>' +
      '<p class="hint" style="margin:-8px 0 14px">Jedna pozycja to jedno ćwiczenie — jeśli robi się je ' +
        "na maszynie obu producentów, obie siedzą na jednej karcie i przełączasz je jednym dotknięciem. " +
        "Stosy wg danych producentów; sprawdź płytki u siebie i popraw, jeśli się różnią.</p>" +
      '<div class="field"><label>Producent</label><div class="setpick" id="c-brand">' +
        '<button type="button" class="chip set" data-b="insp" aria-pressed="true">Nautilus Inspiration</button>' +
        '<button type="button" class="chip set" data-b="tg" aria-pressed="true">Technogym Selection</button>' +
      "</div></div>" +
      '<div class="field"><label>Krok stosu Inspiration</label><div class="setpick" id="c-step">' +
        INSP_STEPS.map(function (o) {
          return '<button type="button" class="chip set" data-step="' + o.v + '" aria-pressed="' +
            (o.v === step) + '">' + o.label + '<span class="chip-n">' + o.note + "</span></button>";
        }).join("") +
      '</div><span class="hint">Maszyny Inspiration przeskakują co 5 lb — stąd 2,25 kg. Technogym: co 5 kg.</span></div>' +
      '<div id="c-body"></div>' +
      '<div class="sheet-actions">' +
        '<button class="btn" id="c-cancel">Anuluj</button>' +
        '<button class="btn primary" id="c-add">Dodaj</button>' +
      "</div></div>";
    document.body.appendChild(scrim);

    var sheet = scrim.querySelector(".sheet");
    var body = scrim.querySelector("#c-body");
    var addBtn = scrim.querySelector("#c-add");

    function chosen() { return CATALOG.filter(function (c) { return picked[c.k] && !mine(c); }); }
    function vsFor(c) {
      var vs = c.v.filter(function (v) { return brands.indexOf(v.b) >= 0; });
      return vs.length ? vs : c.v.slice(0, 1);
    }
    function draw() {
      body.innerHTML = '<p class="sub">Ćwiczenia (' + chosen().length + " z " + CATALOG.length + ")</p>" +
        '<div class="picks">' + CATALOG.map(function (c) {
          var own = mine(c), on = picked[c.k] && !own;
          var desc = vsFor(c).map(function (v) {
            return (BRANDS[v.b] ? BRANDS[v.b].short : "?") + " do " + fmt(v.max) + " kg";
          }).join(" · ");
          return '<div class="pick' + (own ? " off" : "") + '">' +
            '<span class="nm">' + esc(c.n) + "<small>" + esc(c.g) + " · " + esc(desc) +
              (own ? " · już masz" : "") + "</small></span>" +
            '<button type="button" class="plus" data-pick="' + esc(c.k) + '"' + (own ? " disabled" : "") +
              ' aria-pressed="' + on + '" aria-label="' + (on ? "Odznacz" : "Zaznacz") + '">' +
              (on ? "✓" : "+") + "</button></div>";
        }).join("") + "</div>";
      addBtn.textContent = "Dodaj (" + chosen().length + ")";
    }
    draw();

    function redraw() {
      var keep = sheet.scrollTop;
      draw();
      sheet.scrollTop = keep;
      buzz();
    }
    scrim.querySelector("#c-brand").addEventListener("click", function (e) {
      var b = e.target.closest(".chip");
      if (!b) return;
      var key = b.getAttribute("data-b");
      var i = brands.indexOf(key);
      if (i >= 0) { if (brands.length < 2) return; brands.splice(i, 1); }
      else brands.push(key);
      b.setAttribute("aria-pressed", String(brands.indexOf(key) >= 0));
      redraw();
    });
    scrim.querySelector("#c-step").addEventListener("click", function (e) {
      var b = e.target.closest(".chip");
      if (!b) return;
      step = parseFloat(b.getAttribute("data-step"));
      var chips = scrim.querySelectorAll("#c-step .chip");
      for (var i = 0; i < chips.length; i++) chips[i].setAttribute("aria-pressed", String(chips[i] === b));
      buzz();
    });
    body.addEventListener("click", function (e) {
      var b = e.target.closest("[data-pick]");
      if (!b || b.disabled) return;
      var k = b.getAttribute("data-pick");
      picked[k] = !picked[k];
      redraw();
    });
    scrim.addEventListener("click", function (e) { if (e.target === scrim) close(); });
    scrim.querySelector("#c-cancel").addEventListener("click", close);
    addBtn.addEventListener("click", function () {
      var add = chosen();
      if (!add.length) { toast("Nic nie zaznaczone"); return; }
      add.forEach(function (c) { state.machines.push(fromCatalog(c, brands, step)); });
      save(); close(); render();
      toast("Dodano " + add.length + (add.length === 1 ? " ćwiczenie" : add.length < 5 ? " ćwiczenia" : " ćwiczeń"));
    });
    function close() {
      scrim.remove();
      document.removeEventListener("keydown", onKey);
    }
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
  }

  /* ---------- menu: katalog i zerowanie danych ---------- */
  function freshStart() {
    state.machines = CATALOG.map(function (c) { return fromCatalog(c, ["insp", "tg"], 2.25); });
    state.sets = starterSets(state.machines);
    openHist = {};
    openInfo = {};
    filter = "all";
    save();
    saveView();
  }
  function openMenu() {
    var scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Menu">' +
      '<div class="grab"></div><h3>Dane</h3>' +
      '<p class="hint" style="margin:-8px 0 14px">Wszystko siedzi w tym telefonie — nic nie wychodzi na żaden serwer. ' +
        "Masz teraz " + state.machines.length + (state.machines.length === 1 ? " ćwiczenie." : " ćwiczeń.") + "</p>" +
      '<button class="btn wide" id="m-cat" style="margin-bottom:10px">Dołóż z katalogu ćwiczeń</button>' +
      '<button class="btn wide danger" id="m-reset">Wyzeruj dane i zacznij od zera</button>' +
      '<p class="hint" style="margin:9px 0 0">Zerowanie kasuje wszystkie ćwiczenia, poziomy, historię i zestawy, ' +
        "a potem zaciąga cały katalog od nowa. Tego nie da się cofnąć.</p>" +
      '<div class="sheet-actions"><button class="btn wide" id="m-close">Zamknij</button></div></div>';
    document.body.appendChild(scrim);

    scrim.addEventListener("click", function (e) { if (e.target === scrim) close(); });
    scrim.querySelector("#m-close").addEventListener("click", close);
    scrim.querySelector("#m-cat").addEventListener("click", function () { close(); openCatalog(); });
    scrim.querySelector("#m-reset").addEventListener("click", function () {
      if (!confirm("Skasować wszystkie dane i zacząć od nowa z pełnym katalogiem?")) return;
      if (!confirm("Na pewno? Historia i zestawy przepadną bezpowrotnie.")) return;
      freshStart();
      close();
      render();
      window.scrollTo({ top: 0 });
      toast("Zaczynamy od zera — " + state.machines.length + " ćwiczeń");
    });
    function close() {
      scrim.remove();
      document.removeEventListener("keydown", onKey);
    }
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
  }

  /* ---------- układanie zestawu ---------- */
  function openSetEditor(id) {
    var set = findSet(id);
    if (!set) return;
    if (!state.machines.length) { toast("Najpierw dodaj jakąś maszynę"); return; }
    /* pracujemy na kopii — „Anuluj” ma naprawdę anulować */
    var draft = { items: set.items.filter(function (x) { return !!find(x); }) };

    var scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Zestaw ćwiczeń">' +
      '<div class="grab"></div><h3>Zestaw ćwiczeń</h3>' +
      '<div class="field"><label for="s-name">Nazwa</label>' +
        '<input id="s-name" value="' + esc(set.name) + '" placeholder="np. Poniedziałek — góra" autocomplete="off">' +
        '<span class="hint">Kolejność niżej to kolejność ćwiczeń na treningu.</span></div>' +
      '<div id="s-body"></div>' +
      '<div class="sheet-actions">' +
        '<button class="btn" id="s-cancel">Anuluj</button>' +
        '<button class="btn primary" id="s-save">Zapisz</button>' +
      "</div></div>";
    document.body.appendChild(scrim);

    var sheet = scrim.querySelector(".sheet");
    var body = scrim.querySelector("#s-body");

    function draw() {
      var chosen = draft.items.map(find);
      var rest = state.machines.filter(function (m) { return draft.items.indexOf(m.id) < 0; });
      var html = '<p class="sub">W zestawie (' + chosen.length + ")</p>";
      if (chosen.length) {
        html += '<div class="picks">' + chosen.map(function (m, i) {
          return '<div class="pick"><span class="ord">' + (i + 1) + ".</span>" +
            '<span class="nm">' + esc(m.name) + "<small>" + esc(m.group) + "</small></span>" +
            '<button type="button" data-up="' + esc(m.id) + '" aria-label="Wyżej"' + (i === 0 ? " disabled" : "") + ">↑</button>" +
            '<button type="button" data-down="' + esc(m.id) + '" aria-label="Niżej"' + (i === chosen.length - 1 ? " disabled" : "") + ">↓</button>" +
            '<button type="button" data-off="' + esc(m.id) + '" aria-label="Wyrzuć z zestawu">✕</button></div>';
        }).join("") + "</div>";
      } else {
        html += '<p class="picks-empty">Nic tu jeszcze nie ma — dobierz ćwiczenia z listy niżej.</p>';
      }
      if (rest.length) {
        html += '<p class="sub">Dołóż ćwiczenie</p><div class="picks">' + rest.map(function (m) {
          return '<div class="pick"><span class="nm">' + esc(m.name) + "<small>" + esc(m.group) + "</small></span>" +
            '<button type="button" class="plus" data-on="' + esc(m.id) + '" aria-label="Dodaj do zestawu">+</button></div>';
        }).join("") + "</div>";
      }
      body.innerHTML = html;
    }
    draw();

    body.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b || b.disabled) return;
      var on = b.getAttribute("data-on"), off = b.getAttribute("data-off");
      var up = b.getAttribute("data-up"), down = b.getAttribute("data-down");
      if (on) draft.items.push(on);
      else if (off) draft.items = draft.items.filter(function (x) { return x !== off; });
      else if (up || down) {
        var i = draft.items.indexOf(up || down), j = i + (up ? -1 : 1);
        if (i < 0 || j < 0 || j >= draft.items.length) return;
        var t = draft.items[i]; draft.items[i] = draft.items[j]; draft.items[j] = t;
      } else return;
      var keep = sheet.scrollTop;
      draw();
      sheet.scrollTop = keep;
      buzz();
    });

    scrim.addEventListener("click", function (e) { if (e.target === scrim) close(); });
    scrim.querySelector("#s-cancel").addEventListener("click", close);
    scrim.querySelector("#s-save").addEventListener("click", function () {
      var name = scrim.querySelector("#s-name").value.trim();
      set.name = name || set.name;
      set.items = draft.items.slice();
      save();
      filter = "s:" + set.id;
      saveView();
      close();
      render();
      toast(set.name + " — " + set.items.length + " ćw.");
    });
    function close() {
      scrim.remove();
      document.removeEventListener("keydown", onKey);
    }
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
  }

  /* ---------- dotyk: stuknięcie i przytrzymanie ---------- */
  var list = document.getElementById("list");
  var hold = null;

  function startHold(btn, card, m, dir) {
    var delay = setTimeout(function repeat() {
      if (move(m, dir)) { refreshCard(card, m); buzz(5); }
      hold.timer = setTimeout(repeat, 130);
    }, 500);
    hold = { timer: delay, btn: btn };
  }
  function endHold() {
    if (!hold) return;
    clearTimeout(hold.timer);
    hold = null;
  }

  list.addEventListener("pointerdown", function (e) {
    var btn = e.target.closest('[data-act="inc"], [data-act="dec"]');
    if (!btn || btn.disabled) return;
    var card = btn.closest(".card");
    var m = find(card.getAttribute("data-id"));
    if (!m) return;
    var dir = btn.getAttribute("data-act") === "inc" ? 1 : -1;
    if (move(m, dir)) { refreshCard(card, m); buzz(); }
    startHold(btn, card, m, dir);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
    list.addEventListener(ev, endHold);
  });
  window.addEventListener("blur", endHold);

  list.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-act");
    if (act === "inc" || act === "dec") return; // obsłużone przy dotknięciu
    if (act === "setup") { var cur = activeSet(); if (cur) openSetEditor(cur.id); return; }
    if (act === "catalog") { openCatalog(); return; }
    var card = btn.closest(".card");
    var m = find(card.getAttribute("data-id"));
    if (!m) return;
    if (act === "done") { stamp(m); save(); refreshCard(card, m); buzz(); }
    else if (act === "hist") { openHist[m.id] = !openHist[m.id]; render(); }
    else if (act === "info") { openInfo[m.id] = !openInfo[m.id]; render(); }
    else if (act === "vsw") {
      if (useVariant(m, parseInt(btn.getAttribute("data-vi"), 10))) { save(); render(); buzz(); }
    }
    else if (act === "edit") openEditor(m.id);
  });
  document.getElementById("chips").addEventListener("click", function (e) {
    var b = e.target.closest(".chip");
    if (!b) return;
    filter = b.getAttribute("data-v");
    saveView();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.getElementById("add").addEventListener("click", function () { openEditor(null); });
  document.getElementById("menu").addEventListener("click", openMenu);

  /* ---------- podpowiedź: dodaj do ekranu głównego ---------- */
  function installHint() {
    var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
    var touch = window.matchMedia("(pointer: coarse)").matches;
    var seen = false;
    try { seen = localStorage.getItem(LS_HINT) === "1"; } catch (e) {}
    if (standalone || seen || !touch) return;
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
    var slot = document.getElementById("install-slot");
    var el = document.createElement("div");
    el.className = "install";
    el.innerHTML = "<div><b>Miej to pod ręką na siłowni.</b> " +
      (ios ? "Udostępnij ⬆ → „Dodaj do ekranu początkowego”."
           : "Menu przeglądarki ⋮ → „Dodaj do ekranu głównego”.") +
      " Otworzy się jak zwykła aplikacja, działa też bez zasięgu.</div>" +
      '<button aria-label="Zamknij podpowiedź">×</button>';
    el.querySelector("button").addEventListener("click", function () {
      try { localStorage.setItem(LS_HINT, "1"); } catch (e) {}
      el.remove();
    });
    slot.appendChild(el);
  }

  /* ---------- start ---------- */
  function adopt(data) {
    if (!data || !Array.isArray(data.machines)) return false;
    state.machines = data.machines.map(function (m) {
      var stack = Array.isArray(m.stack) ? m.stack.filter(function (v) { return typeof v === "number" && isFinite(v); }) : [];
      var level = typeof m.level === "number" ? m.level : 0;
      /* starsze zapisy nie znały wariantów — robimy z nich jeden, bez marki */
      var variants = Array.isArray(m.variants) && m.variants.length
        ? m.variants.map(function (v) {
            return {
              b: BRANDS[v.b] ? v.b : "",
              m: String(v.m || ""),
              stack: Array.isArray(v.stack) ? v.stack.filter(function (x) { return typeof x === "number" && isFinite(x); }) : [],
              level: typeof v.level === "number" ? v.level : 0
            };
          }).filter(function (v) { return v.stack.length; })
        : [];
      if (!variants.length) variants = [{ b: "", m: "", stack: stack.slice(), level: level }];
      var vi = typeof m.vi === "number" && m.variants && variants[m.vi] ? m.vi : 0;
      if (!stack.length) { stack = variants[vi].stack.slice(); level = variants[vi].level || 0; }
      return {
        id: m.id || uid(),
        name: String(m.name || "Maszyna"),
        group: GROUPS.indexOf(m.group) >= 0 ? m.group : "Inne",
        ex: typeof m.ex === "string" ? m.ex : null,
        variants: variants,
        vi: vi,
        stack: stack,
        level: level,
        lastAt: m.lastAt || null,
        history: Array.isArray(m.history) ? m.history : []
      };
    });
    state.sets = adoptSets(data.sets, state.machines);
    return true;
  }
  /* zestawy z pamięci: zawsze trzy, tylko istniejące maszyny, bez duplikatów */
  function adoptSets(raw, machines) {
    var ids = machines.map(function (m) { return m.id; });
    if (!Array.isArray(raw)) raw = [];
    return newSets().map(function (d, i) {
      var r = raw[i] || {};
      var name = typeof r.name === "string" && r.name.trim() ? r.name.trim() : d.name;
      var items = Array.isArray(r.items) ? r.items.filter(function (x, k, arr) {
        return ids.indexOf(x) >= 0 && arr.indexOf(x) === k;
      }) : [];
      return { id: d.id, name: name, items: items };
    });
  }

  var booted = false;
  try {
    var cached = localStorage.getItem(LS_KEY);
    if (cached) booted = adopt(JSON.parse(cached));
  } catch (e) {}
  if (!booted) {
    state.machines = DEFAULTS;
    state.sets = starterSets(state.machines);
  }
  try {
    var savedView = localStorage.getItem(LS_VIEW);
    if (savedView) filter = savedView;
  } catch (e) {}
  render();
  installHint();
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
